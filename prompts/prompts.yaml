zero_shot: |
  请判断以下评论的情感是正面还是负面。只输出"正面"或"负面"。
  【重要】请直接输出结论，不要展示任何思考过程、不要解释、不要输出英文。
  评论：{text}

few_shot: |
  请判断以下评论的情感是正面还是负面。只输出"正面"或"负面"。
  【重要】请直接输出结论，不要展示任何思考过程、不要解释、不要输出英文。
  示例1：
  评论：房间很干净，服务态度特别好，下次还会入住！
  情感：正面

  示例2：
  评论：这家酒店环境太差了，绝对不会再来！
  情感：负面

  示例3：
  评论：这家酒店生态环境真是太好了！晚上竟然还有老鼠跟我一起玩。
  情感：负面

  示例4：
  评论：一般般吧，没有想象中那么好，但也凑合。
  情感：正面

  现在请判断：
  评论：{text}
  情感：

cot: |
  请判断以下评论的情感是正面还是负面。请先分析评论中的关键情感词，然后给出结论。

  评论：{text}

  请按以下格式输出：
  分析：<你的简要分析>
  结论：<正面 或 负面>

